[package]
name = "nyx-core"
version = "0.1.0"
edition = "2021"
description = "Shell-agnostic core of nyx (PTY, OSC, DB, MCP, agents, commands, sessions). No shell/UI types cross its API; the sidecar adapts to it via the EventSink / AppPaths / service-container / boot-shutdown frontiers."

[lib]
name = "nyx_core"
# `rlib` only: nyx-core is a plain Rust library consumed by the supervised nyx-sidecar
# (crates/nyx-sidecar). It is never a cdylib/staticlib itself — the sidecar owns that.
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LOGIC-LESS Handlebars renderer of a proto COMPOSITION into markup (v2.7 Phase 3, task
# 01KY4DFPPM4KXFWWYCFQSMRKVX, PDR-0010). The whole compilation lives in the sidecar (this crate):
# each `design_components` template is registered as a PARTIAL and the composition tree is walked
# in Rust so the templates themselves stay logic-less. `default-features = false` keeps the surface
# to the core mustache engine — none of the logic-carrying extras (rhai / script_helper /
# string_helpers / dir_source / rust-embed) that would let a template smuggle in logic.
handlebars = { version = "6", default-features = false }
# Interactive + managed-command PTYs. No cmake.
portable-pty = "0.9"
anyhow = "1"
# Terminal record ids are UUIDv7 (time-ordered).
uuid = { version = "1", features = ["v7"] }
# Persistence: SQLite via Diesel. `bundled` vendors SQLite (no system lib).
# `returning_clauses_for_sqlite_3_35` enables RETURNING on INSERT.
# `r2d2` pulls in diesel's re-exported r2d2 connection pool (the PRD-frozen pool —
# NOT deadpool-diesel, NO Tokio): `diesel::r2d2::{Pool, ConnectionManager,
# CustomizeConnection}`. One pool shared by the pipe dispatch AND the MCP server
# threads, with WAL + foreign_keys set on EVERY checkout via a customizer.
diesel = { version = "2", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
diesel_migrations = "2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# Local MCP HTTP server: small synchronous loopback HTTP, bound to 127.0.0.1.
tiny_http = "0.12"
# Per-terminal CPU%/RAM (FEEDBACK #28): cross-platform process introspection
# (Linux/macOS/Windows) WITHOUT touching `/proc` directly — sysinfo abstracts the
# per-OS process table, CPU usage and RSS. `default-features = false` + only the
# `system` feature: we never read disks/networks/components, just processes.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# `get_command_output`'s `grep` render knob is a regex matched per-line on the
# ANSI-stripped text (v1 parity: apps/tauri/src-tauri `optional_regex`/`render_output`).
regex = "1"
# Pure-Rust Git plumbing for the v2.4 diff/review engine (PDR-0007, sidecar-side):
# gix is the PRIMARY diff/blob/ref/revwalk backend; a `git` CLI fallback
# (crate::proc_util::command) covers anything gix cannot resolve so the engine is
# always coherent. `default-features = false` keeps the surface tight and avoids the
# heavy networking/transport stack (no remote — the review is 100% local):
#   * `sha1`      — REQUIRED hash backend (gix-hash/sha1). Without a hash feature the
#                   `Kind` enum is empty and gix-hash does not compile; gix's own
#                   `default` pulls this in, so dropping default-features means we must
#                   re-enable it explicitly.
#   * `blob-diff` — line-level blob diff (hunks) — the core of the diff engine.
#   * `revision`  — rev-spec parsing + revwalk (commit/range, ahead/behind).
#   * `dirwalk`   — untracked-file walk (the `??` side of the working-tree diff).
#   * `status`    — index-vs-worktree / index-vs-HEAD status (staged / unstaged).
#   * `max-performance-safe` — the zlib-rs + prodash acceleration gix ships by default,
#                   without the C zlib-ng dep (pure-Rust, no cmake).
gix = { version = "0.85.0", default-features = false, features = ["sha1", "blob-diff", "revision", "dirwalk", "status", "max-performance-safe"] }

# Filesystem/refs WATCHER for the v2.4 real-time refresh of the derived Git views
# (task 01KX0F6GDZEH3YN6QJDB7FC0WC, Q-015). `notify` is the OS-native change source
# (inotify on Linux, FSEvents on macOS, ReadDirectoryChangesW on Windows) — NO polling:
# the kernel reports a work-tree edit / `.git` ref change and we recompute + push on that
# event, coalesced by our own debounce. Used only by `crate::git_watch`; the shell
# (sidecar) drives it against the v2.1 EventSink pipe. Default features keep the macOS
# FSEvents backend; on Linux/Windows they are inert.
notify = "7"

# Process-group (process-tree) kill for managed commands on Unix: SIGTERM/SIGKILL to
# the child's process GROUP so stopping a service reaps the whole tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# v2.8 P1 runtime spike (`tests/nyx_next_loop_spike.rs`): the integration test drives
# the REAL `command::CommandPty` gate primitive, which takes a `portable_pty::PtySize`.
# The lib already depends on portable-pty; the integration test (built without
# `cfg(test)`) needs it in scope to construct that size.
portable-pty = "0.9"
# Probe (via kill(pid, 0)) that a child shell is really dead after pty close.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
